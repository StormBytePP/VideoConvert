name: "CodeQL Analysis"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '43 19 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        if: matrix.language == 'c-cpp' && matrix.build-mode == 'manual'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libboost-dev \
            libboost-filesystem-dev \
            libconfig++-dev \
            libsqlite3-dev \
            ffmpeg \
            git \
            libjsoncpp-dev

      - name: Install toolchain
        if: matrix.language == 'c-cpp' && matrix.build-mode == 'manual'
        id: install-toolchain
        uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
        with:
          toolchain: clang

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Configure & Build (for CodeQL)
        if: matrix.language == 'c-cpp' && matrix.build-mode == 'manual'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${{ steps.install-toolchain.outputs.c_compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ steps.install-toolchain.outputs.cxx_compiler }}" \
            -DENABLE_HEVC=ON \
            -DENABLE_AAC=ON \
            -DENABLE_FDKAAC=ON \
            -DENABLE_AC3=ON \
            -DENABLE_EAC3=ON \
            -DENABLE_OPUS=ON
          cmake --build build --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"